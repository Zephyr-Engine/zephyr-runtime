name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container: jackpar/x11-zig:0.16.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build project
        run: zig build -Doptimize=ReleaseFast

      - name: Build project
        run: zig build test --summary all
